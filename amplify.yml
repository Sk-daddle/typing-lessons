version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install -g pnpm@10.33.2
        - pnpm install --frozen-lockfile
    build:
      commands:
        # Amplify env vars exist only at build time; Next.js server runtime
        # reads them from .env.production inside the compute bundle.
        - env | grep -E '^(DATABASE_URL|CLERK_SECRET_KEY|NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY)=' >> .env.production
        - pnpm build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
